name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check plugin loads
        run: |
          python -c "
          import sys, importlib.util
          # Load provider.py directly — no Hermes deps needed for syntax check
          spec = importlib.util.spec_from_file_location('provider', 'plugins/web/agy/provider.py')
          # Just verify the file is valid Python and has the class
          import ast
          with open('plugins/web/agy/provider.py') as f:
              tree = ast.parse(f.read())
          classes = [n.name for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]
          assert 'AgYWebSearchProvider' in classes, 'AgYWebSearchProvider class not found'
          print('✓ provider.py valid')
          for module in ('__init__.py', 'oauth_provider.py'):
              with open('plugins/web/agy/' + module) as f:
                  ast.parse(f.read())
              print('✓ ' + module + ' valid')
          # Hermes only discovers plugins/web/<name>/ dirs that carry a manifest
          with open('plugins/web/agy/plugin.yaml') as f:
              manifest = f.read()
          assert 'kind: backend' in manifest, 'plugin.yaml must declare kind: backend'
          for provider in ('agy', 'agy-oauth'):
              assert provider in manifest, 'provides_web_providers must list ' + provider
          print('✓ plugin.yaml valid')
          with open('install.sh') as f:
              content = f.read()
              assert 'plugins/web/agy' in content
              assert 'search_backend: agy' in content
              # Files are copied as a set: a hardcoded list silently drops modules
              assert 'plugins/web/agy/\"*.py' in content, 'install.sh must copy every plugin file'
              assert 'MINGW' in content, 'install.sh must handle Windows'
          print('✓ install.sh valid')
          print('All checks passed')
          "
